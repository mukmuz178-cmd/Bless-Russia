<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bless Russia — Скачать Лаунчер</title>
    <style>
        /* Сброс стандартных отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Полностью черный глубокий фон */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Контейнер по центру экрана */
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
        }

        /* Стильный заголовок проекта */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Текст описания */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 40px;
        }

        /* Красная кнопка как в Блек Раше */
        .download-btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: #ff0000; /* Чистый красный цвет */
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 8px; /* Слегка округлые края в стиле лаунчеров */
            /* Мощное красное неоновое свечение кнопки */
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none; /* Убираем стандартную рамку кнопки */
        }

        /* Эффект при наведении или нажатии пальцем */
        .download-btn:hover {
            background-color: #cc0000; /* Чуть темнее при наведении */
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.8);
            transform: scale(1.03); /* Кнопка слегка увеличивается */
        }

        /* Адаптивность для маленьких экранов телефонов */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .download-btn { width: 100%; padding: 16px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Добро пожаловать на Bless Russia!</h1>
        <p>Скачайте официальный лаунчер по кнопке ниже и погрузитесь в игру.</p>
        
        <!-- КНОПКА С ПРЯМОЙ ССЫЛКОЙ ЯНДЕКСА -->
        <a href="https://yandex.net" download="bless_russia.apk" class="download-btn">
            Скачать лаунчер
        </a>
    </div>

</body>
</html>
